name = "jm-express-whatsapp"
main = "whatsapp-worker.js"
compatibility_date = "2026-11-26"

# Create the D1 database, then replace this placeholder with the ID returned by Wrangler.
[[d1_databases]]
binding = "DB"
database_name = "jm-express"
database_id = "YOUR_DATABASE_ID"

# Required secrets are configured with `wrangler secret put`.
# META_WEBHOOK_TOKEN
# META_APP_SECRET
# ADMIN_API_TOKEN

# No public route is configured here. Bind a route only after the Worker is
# deployed and the webhook has been verified in a controlled test.
